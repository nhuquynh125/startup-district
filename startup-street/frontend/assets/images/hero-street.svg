    <!-- Empty lot -->
    <rect x="480" y="352" width="120" height="54" rx="6" fill="#bfe5b0" stroke-dasharray="12 9"/>
    <rect x="536" y="296" width="8" height="58" fill="#1b2b3a" stroke="none"/>
    <rect x="502" y="268" width="76" height="40" rx="8" fill="#ffb627"/>
    <text x="540" y="294" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-weight="700" font-size="17" fill="#1b2b3a" stroke="none" textLength="58" lengthAdjust="spacingAndGlyphs">For Rent</text>

