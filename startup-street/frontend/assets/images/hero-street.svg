    <path d="M52 290h168l10 36H42z" fill="#fff"/><path d="M52 290h28l-6 36H42zM108 290h28l-2 36h-28zM164 290h28l6 36h-28z" fill="#e0624c"/>
    <rect x="58" y="338" width="70" height="68" rx="6" fill="#fff0c9"/><rect x="150" y="338" width="50" height="68" rx="6" fill="#14313a"/>

