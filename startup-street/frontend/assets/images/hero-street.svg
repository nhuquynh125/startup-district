    <text x="358" y="221" text-anchor="middle" font-family="Fredoka, system-ui, sans-serif" font-weight="700" font-size="23" fill="#fff" stroke="none" textLength="120" lengthAdjust="spacingAndGlyphs">Bubble Tea</text>
    <path d="M272 254h172l10 36H262z" fill="#fff"/><path d="M272 254h29l-5 36h-34zM330 254h29l-2 36h-29zM388 254h29l5 36h-29z" fill="#0e8a84"/>
    <rect x="282" y="306" width="72" height="100" rx="6" fill="#cdebf3"/><rect x="376" y="306" width="58" height="100" rx="6" fill="#14313a"/>
